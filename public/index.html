<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alluz Tech — A IA que trabalha enquanto você lidera</title>
  <meta name="description" content="Implementamos IA e automação para PMEs. Diagnóstico grátis, preço fixo, suporte garantido.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="icon" type="image/png" href="assets/alluz-logo.png">
  <style>
    :root {
      --void: #0C0B09;
      --carbon: #161310;
      --carbon-2: #1F1B14;
      --surface: #2A2519;
      --gold: #FFAB2E;
      --gold-light: #FFD080;
      --gold-deep: #D4891A;
      --gold-pale: #FFF3D6;
      --text: #F5EED8;
      --text-muted: #C0B490;
      --muted: #7A7060;
      --border: rgba(255,171,46,0.12);
      --border-strong: rgba(255,171,46,0.30);
      --ff-display: 'Outfit', system-ui, sans-serif;
      --ff-body: 'Outfit', system-ui, sans-serif;
      --ff-mono: 'JetBrains Mono', ui-monospace, monospace;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; padding: 0;
      background: var(--void); color: var(--text);
      font-family: var(--ff-body);
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.005em;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, p { margin: 0; }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 32px; }
    @media (max-width: 768px) { .container { padding: 0 20px; } }
    .eyebrow {
      font-family: var(--ff-mono); font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--gold);
      display: inline-flex; gap: 10px; align-items: center; font-weight: 500;
    }
    .eyebrow::before { content: ''; width: 24px; height: 1px; background: currentColor; opacity: 0.5; }
    .display { font-family: var(--ff-display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
    .mono { font-family: var(--ff-mono); }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--ff-display); font-weight: 700; font-size: 14px; letter-spacing: 0.005em;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
      color: #1A0F00; padding: 14px 26px; border-radius: 10px; border: 0; outline: none;
      box-shadow: 0 8px 22px rgba(255,171,46,0.25), inset 0 1px 0 rgba(255,255,255,0.18);
      transition: transform .25s var(--ease-out), box-shadow .25s var(--ease-out), filter .25s var(--ease-out);
      cursor: pointer;
    }
    .btn-primary:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 14px 32px rgba(255,171,46,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
      filter: brightness(1.05);
    }
    .btn-primary:active { transform: translateY(0) scale(1); }
    .btn-outline {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--ff-display); font-weight: 600; font-size: 14px;
      background: transparent; color: var(--gold); padding: 13px 25px; border-radius: 10px;
      border: 1.5px solid rgba(255,171,46,0.40);
      transition: all .25s var(--ease-out); cursor: pointer;
    }
    .btn-outline:hover { background: rgba(255,171,46,0.06); border-color: var(--gold); transform: translateY(-2px); }
    .tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--ff-mono); font-size: 11px; font-weight: 500;
      letter-spacing: 0.04em; color: var(--gold);
      background: rgba(255,171,46,0.08); border: 1px solid var(--border);
      border-radius: 99px; padding: 5px 11px; white-space: nowrap;
    }
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s var(--ease-out), transform .8s var(--ease-out); }
    .reveal.in { opacity: 1; transform: translateY(0); }
    ::selection { background: var(--gold); color: #1A0F00; }
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: var(--void); }
    ::-webkit-scrollbar-thumb { background: rgba(255,171,46,0.25); border-radius: 99px; border: 3px solid var(--void); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,171,46,0.5); }
    @keyframes breathe {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,171,46,0.45), 0 0 30px rgba(255,171,46,0.45); }
      50% { box-shadow: 0 0 0 18px rgba(255,171,46,0.0), 0 0 60px rgba(255,171,46,0.65); }
    }
    @keyframes pin-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,171,46,0.35), 0 0 24px rgba(255,171,46,0.25); }
      50% { box-shadow: 0 0 0 14px rgba(255,171,46,0), 0 0 36px rgba(255,171,46,0.4); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes typing { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── CHATBOT ── */
    .chat-fab {
      position: fixed; bottom: 28px; right: 28px; z-index: 200;
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--gold), var(--gold-deep));
      border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(255,171,46,0.3);
      transition: transform .2s;
    }
    .chat-fab:hover { transform: scale(1.08); }
    .chat-window {
      position: fixed; bottom: 96px; right: 28px; z-index: 200;
      width: 380px; max-height: 560px;
      background: var(--carbon-2); border: 1px solid var(--border);
      border-radius: 20px; display: flex; flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
      transform: scale(0.95) translateY(10px); opacity: 0; pointer-events: none;
      transition: all .25s cubic-bezier(.34,1.56,.64,1);
    }
    .chat-window.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }
    .chat-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .chat-avatar { width: 36px; height: 36px; background: linear-gradient(135deg,var(--gold),var(--gold-deep)); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .chat-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .chat-status { font-size: 11px; color: #1ED278; display: flex; align-items: center; gap: 5px; }
    .chat-dot { width: 6px; height: 6px; border-radius: 50%; background: #1ED278; animation: pulse 2s infinite; }
    .chat-close { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; padding: 4px; }
    .chat-close:hover { color: var(--text); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 200px; max-height: 340px; }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--surface); border-radius: 2px; }
    .msg { max-width: 85%; display: flex; flex-direction: column; gap: 4px; }
    .msg-bot { align-self: flex-start; }
    .msg-user { align-self: flex-end; }
    .msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; }
    .msg-bot .msg-bubble { background: var(--carbon); color: var(--text); border-radius: 4px 12px 12px 12px; }
    .msg-user .msg-bubble { background: linear-gradient(135deg,var(--gold),var(--gold-deep)); color: #1A0F00; font-weight: 500; border-radius: 12px 4px 12px 12px; }
    .msg-time { font-size: 10px; color: var(--muted); padding: 0 4px; }
    .typing { display: flex; gap: 5px; padding: 12px 14px; background: var(--carbon); border-radius: 4px 12px 12px 12px; width: fit-content; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: typing .8s ease-in-out infinite; }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    .chat-input-row { padding: 14px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; }
    .chat-input { flex: 1; background: var(--void); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-family: var(--ff-body); font-size: 13px; color: var(--text); outline: none; resize: none; }
    .chat-input:focus { border-color: rgba(255,171,46,0.4); }
    .chat-input::placeholder { color: var(--muted); }
    .chat-send { background: linear-gradient(135deg,var(--gold),var(--gold-deep)); border: none; border-radius: 8px; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity .2s; }
    .chat-send:hover { opacity: .9; }
    .chat-suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 14px 10px; }
    .suggestion { background: rgba(255,171,46,0.08); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 11px; color: var(--gold); font-weight: 600; cursor: pointer; transition: background .2s; white-space: nowrap; }
    .suggestion:hover { background: rgba(255,171,46,0.15); }

    /* ── COOKIE ── */
    .cookie { position: fixed; bottom: 0; left: 0; right: 0; z-index: 300; background: var(--carbon-2); border-top: 1px solid var(--border); padding: 16px 48px; display: flex; align-items: center; gap: 20px; transform: translateY(100%); transition: transform .4s ease; box-shadow: 0 -8px 32px rgba(0,0,0,.4); }
    .cookie.show { transform: translateY(0); }
    .cookie-text { flex: 1; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .cookie-text a { color: var(--gold); }
    .cookie-btns { display: flex; gap: 10px; flex-shrink: 0; }
    .cookie-accept { background: linear-gradient(135deg,var(--gold),var(--gold-deep)); color: #1A0F00; border: none; padding: 9px 18px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .cookie-minimal { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 9px 18px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .cookie-minimal:hover { border-color: var(--muted); }

    /* ── CONTACT FORM ── */
    .contact-form { display: flex; flex-direction: column; gap: 12px; }
    .contact-form input, .contact-form textarea {
      background: var(--void); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 16px; font-family: var(--ff-body); font-size: 14px;
      color: var(--text); outline: none; width: 100%;
    }
    .contact-form input:focus, .contact-form textarea:focus { border-color: rgba(255,171,46,0.4); }
    .contact-form input::placeholder, .contact-form textarea::placeholder { color: var(--muted); }
    .contact-form textarea { resize: vertical; min-height: 90px; }
    #formSuccess { display: none; color: var(--gold); font-size: 14px; text-align: center; padding: 12px; }

    @media (max-width: 880px) {
      .chat-window { width: calc(100vw - 32px); right: 16px; bottom: 80px; }
      .cookie { flex-direction: column; align-items: flex-start; padding: 16px 24px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- CHATBOT FAB -->
  <button class="chat-fab" onclick="toggleChat()" id="chatFab" aria-label="Abrir chat">
    <svg viewBox="0 0 24 24" fill="none" width="24" height="24" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>

  <!-- CHATBOT WINDOW -->
  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <div class="chat-avatar"><svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <div>
        <div class="chat-name">Luz · Alluz Tech</div>
        <div class="chat-status"><div class="chat-dot"></div>Online agora</div>
      </div>
      <button class="chat-close" onclick="toggleChat()">×</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-suggestions" id="chatSuggestions">
      <button class="suggestion" onclick="sendSuggestion(this)">O que vocês fazem?</button>
      <button class="suggestion" onclick="sendSuggestion(this)">Quanto custa?</button>
      <button class="suggestion" onclick="sendSuggestion(this)">Como começar?</button>
      <button class="suggestion" onclick="sendSuggestion(this)">Exemplos práticos</button>
    </div>
    <div class="chat-input-row">
      <textarea class="chat-input" id="chatInput" placeholder="Pergunte sobre IA para o seu negócio..." rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="chat-send" onclick="sendMessage()" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <!-- COOKIE BANNER -->
  <div class="cookie" id="cookieBanner">
    <div class="cookie-text">
      Utilizamos cookies para melhorar sua experiência. Ao continuar, você concorda com nossa Política de Privacidade e com a LGPD.
    </div>
    <div class="cookie-btns">
      <button class="cookie-minimal" onclick="acceptCookies('essential')">Apenas essenciais</button>
      <button class="cookie-accept" onclick="acceptCookies('all')">Aceitar todos</button>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── Hooks ──────────────────────────────────────────────────────────
    function useReveal(opts = {}) {
      const ref = useRef(null);
      const [seen, setSeen] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setSeen(true); obs.disconnect(); }
        }, { threshold: opts.threshold ?? 0.18, rootMargin: opts.rootMargin ?? '0px 0px -8% 0px' });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return [ref, seen];
    }

    function useCounter(target, { duration = 1200, start = 0, run = true } = {}) {
      const [val, setVal] = useState(start);
      useEffect(() => {
        if (!run) return;
        const t0 = performance.now();
        let raf;
        const tick = (now) => {
          const t = Math.min(1, (now - t0) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          setVal(start + (target - start) * eased);
          if (t < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [target, duration, start, run]);
      return val;
    }

    function useScrollProgress(ref) {
      const [p, setP] = useState(0);
      useEffect(() => {
        const onScroll = () => {
          const el = ref.current;
          if (!el) return;
          const r = el.getBoundingClientRect();
          const vh = window.innerHeight;
          const total = r.height + vh;
          const dist = vh - r.top;
          setP(Math.max(0, Math.min(1, dist / total)));
        };
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
      }, []);
      return p;
    }

    function useScrollY() {
      const [y, setY] = useState(0);
      useEffect(() => {
        const on = () => setY(window.scrollY || 0);
        on();
        window.addEventListener('scroll', on, { passive: true });
        return () => window.removeEventListener('scroll', on);
      }, []);
      return y;
    }

    function Reveal({ children, delay = 0, style, className, ...rest }) {
      const [ref, seen] = useReveal();
      return (
        <div ref={ref} className={`reveal ${seen ? 'in' : ''} ${className || ''}`}
          style={{ transitionDelay: `${delay}ms`, ...style }} {...rest}>
          {children}
        </div>
      );
    }

    // ── Logo ──────────────────────────────────────────────────────────
    function Logo({ height = 30 }) {
      return (
        <a href="#top" style={{ display: 'inline-flex', alignItems: 'center' }}>
          <img src="assets/alluz-logo.png" alt="Alluz Tech" style={{ height, width: 'auto', display: 'block' }} />
        </a>
      );
    }

    // ── NAV ───────────────────────────────────────────────────────────
    function Nav() {
      const [scrolled, setScrolled] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      useEffect(() => {
        const on = () => setScrolled((window.scrollY || 0) > 24);
        on();
        window.addEventListener('scroll', on, { passive: true });
        return () => window.removeEventListener('scroll', on);
      }, []);
      const links = [['Método','#metodo'],['Cases','#cases'],['Tecnologias','#tech'],['Sobre','#sobre'],['FAQ','#faq']];
      return (
        <header style={{
          position: 'fixed', top: 0, left: 0, right: 0, zIndex: 50,
          transition: 'background .3s, border-color .3s',
          background: scrolled ? 'rgba(12,11,9,0.78)' : 'transparent',
          backdropFilter: scrolled ? 'blur(14px) saturate(1.4)' : 'none',
          WebkitBackdropFilter: scrolled ? 'blur(14px) saturate(1.4)' : 'none',
          borderBottom: scrolled ? '1px solid var(--border)' : '1px solid transparent',
        }}>
          <div className="container" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 72 }}>
            <Logo height={28} />
            <nav style={{ display: 'flex', alignItems: 'center', gap: 36 }} className="desktop-nav">
              {links.map(([l, h]) => (
                <a key={l} href={h} style={{ fontSize: 14, color: 'var(--text-muted)', fontWeight: 500, transition: 'color .2s' }}
                  onMouseEnter={e => e.currentTarget.style.color = 'var(--gold)'}
                  onMouseLeave={e => e.currentTarget.style.color = 'var(--text-muted)'}>{l}</a>
              ))}
              <a href="#contato" className="btn-primary" style={{ padding: '10px 20px', fontSize: 13 }}>
                Diagnóstico grátis
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
              </a>
            </nav>
            <button className="mobile-toggle" aria-label="menu" onClick={() => setMobileOpen(v => !v)}
              style={{ display: 'none', background: 'transparent', border: 'none', color: 'var(--gold)', padding: 8, fontSize: 22 }}>☰</button>
          </div>
          {mobileOpen && (
            <div style={{ padding: '16px 20px 24px', background: 'rgba(12,11,9,0.96)', borderTop: '1px solid var(--border)', display: 'flex', flexDirection: 'column', gap: 14 }}>
              {links.map(([l, h]) => (
                <a key={l} href={h} onClick={() => setMobileOpen(false)} style={{ fontSize: 15, color: 'var(--text)', padding: '8px 0' }}>{l}</a>
              ))}
              <a href="#contato" className="btn-primary" onClick={() => setMobileOpen(false)} style={{ marginTop: 8 }}>Diagnóstico grátis →</a>
            </div>
          )}
          <style>{`@media(max-width:880px){.desktop-nav{display:none!important}.mobile-toggle{display:block!important}}`}</style>
        </header>
      );
    }

    // ── HERO ─────────────────────────────────────────────────────────
    function Hero() {
      const y = useScrollY();
      return (
        <section id="top" style={{ position: 'relative', minHeight: '100vh', paddingTop: 120, paddingBottom: 100, overflow: 'hidden', display: 'flex', alignItems: 'center' }}>
          <div aria-hidden style={{ position: 'absolute', top: -120, right: -160, width: 720, height: 720, pointerEvents: 'none', background: 'radial-gradient(circle, rgba(255,171,46,0.18), rgba(255,171,46,0.04) 35%, transparent 65%)', filter: 'blur(20px)', animation: 'breathe 9s ease-in-out infinite', transform: `translateY(${y * 0.18}px)` }} />
          <div aria-hidden style={{ position: 'absolute', bottom: -240, left: -180, width: 640, height: 640, pointerEvents: 'none', background: 'radial-gradient(circle, rgba(212,137,26,0.14), transparent 65%)', filter: 'blur(28px)', animation: 'breathe 12s ease-in-out infinite reverse', transform: `translateY(${y * 0.10}px)` }} />
          <div aria-hidden style={{ position: 'absolute', inset: 0, pointerEvents: 'none', opacity: 0.4, backgroundImage: 'radial-gradient(rgba(255,171,46,0.10) 1px, transparent 1px)', backgroundSize: '32px 32px', maskImage: 'radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 80%)', WebkitMaskImage: 'radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 80%)' }} />
          <div className="container" style={{ position: 'relative' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1.15fr 1fr', gap: 72, alignItems: 'center' }} className="hero-grid">
              <div style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>
                <Reveal delay={0}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                    <span style={{ width: 38, height: 38, borderRadius: 10, background: 'linear-gradient(135deg, var(--carbon-2), var(--carbon))', border: '1px solid var(--border-strong)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', animation: 'pulse-glow 2.4s ease-in-out infinite' }}>

  <script>
    // ── CHATBOT ───────────────────────────────────────────────────────
    let chatOpen = false, chatHistory = [], isTyping = false;

    function toggleChat() {
      chatOpen = !chatOpen;
      document.getElementById('chatWindow').classList.toggle('open', chatOpen);
      if (chatOpen && chatHistory.length === 0) {
        setTimeout(() => addBotMessage("Olá! Sou a **Luz**, assistente da Alluz Tech. 👋\n\nEstou aqui para responder suas dúvidas sobre como a inteligência artificial pode transformar o seu negócio.\n\nComo posso te ajudar hoje?"), 400);
      }
      if (chatOpen) document.getElementById('chatInput').focus();
    }

    function addBotMessage(text) {
      const msgs = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'msg msg-bot';
      const formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
      div.innerHTML = `<div class="msg-bubble">${formatted}</div><div class="msg-time">${getTime()}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      chatHistory.push({ role: 'assistant', content: text });
    }

    function addUserMessage(text) {
      const msgs = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'msg msg-user';
      div.innerHTML = `<div class="msg-bubble">${text}</div><div class="msg-time">${getTime()}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      chatHistory.push({ role: 'user', content: text });
      document.getElementById('chatSuggestions').style.display = 'none';
    }

    function showTyping() {
      const msgs = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'msg msg-bot'; div.id = 'typingIndicator';
      div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function removeTyping() { const t = document.getElementById('typingIndicator'); if (t) t.remove(); }
    function getTime() { return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || isTyping) return;
      input.value = ''; input.style.height = 'auto';
      addUserMessage(text);
      isTyping = true; showTyping();
      try {
        const response = await fetch('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory.slice(-10) })
        });
        const data = await response.json();
        removeTyping();
        addBotMessage(data.reply || 'Desculpe, tive um problema. Tente novamente em instantes!');
      } catch(e) {
        removeTyping();
        addBotMessage('Ops! Houve uma instabilidade. Tente novamente ou entre em contato pelo formulário. 😊');
      }
      isTyping = false;
    }

    function sendSuggestion(btn) { document.getElementById('chatInput').value = btn.textContent; sendMessage(); }
    function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

    document.getElementById('chatInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 80) + 'px';
    });

    // ── COOKIES ───────────────────────────────────────────────────────
    function acceptCookies(type) {
      localStorage.setItem('alluztech_cookies', type);
      const b = document.getElementById('cookieBanner');
      b.style.transform = 'translateY(100%)';
      setTimeout(() => b.style.display = 'none', 400);
    }

    window.addEventListener('load', () => {
      if (!localStorage.getItem('alluztech_cookies')) {
        setTimeout(() => document.getElementById('cookieBanner').classList.add('show'), 1500);
      }
    });
  </script>
</body>
</html>
