services:
  alluz-tech:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Hot reload do frontend em dev (não afeta o container de prod)
      - ./public:/app/public:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
