services:
  # API Backend (Express)
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Hot reload do frontend em dev (não afeta o container de prod)
      - ./public:/app/public:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Vite Dev Server (React + Tailwind)
  vite:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules  # cache node_modules
    command: npm run dev
    restart: unless-stopped
    stdin_open: true
    tty: true
